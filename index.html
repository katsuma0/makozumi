<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makozumi — Authenticity Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2e9;
    --card: #fdfbf5;
    --ink: #26221e;
    --muted: #877f73;
    --line: #e2dac9;
    --accent: #c73e2e;
    --ok: #48725a;
    --ok-bg: #eaf1ea;
    --bad: #a83226;
    --bad-bg: #f7e9e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f;
      --card: #1e1a15;
      --ink: #eae3d6;
      --muted: #9c9384;
      --line: #37312a;
      --accent: #e0563f;
      --ok: #7fb08f;
      --ok-bg: #1c2a20;
      --bad: #e08573;
      --bad-bg: #33201b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 2.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 480px; }
  header { text-align: center; margin-bottom: 2rem; }
  header::after {
    content: ""; display: block; width: 44px; height: 1px;
    background: var(--accent); margin: 1.1rem auto 0;
  }
  .seal {
    width: 60px; height: 60px; margin: 0 auto .9rem;
    background: var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.8rem; font-weight: 700;
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: .5em; text-transform: uppercase; padding-left: .5em; }
  .tagline { color: var(--muted); font-size: .85rem; letter-spacing: .22em; margin-top: .5rem; text-transform: uppercase; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 5px;
    padding: 1.5rem; margin-bottom: 1rem;
  }
  .status { text-align: center; padding: 1.25rem; border-radius: 5px; margin-bottom: 1rem; }
  .status .big { font-size: 1.25rem; font-weight: 700; letter-spacing: .18em; }
  .status .sub { font-size: .85rem; margin-top: .35rem; }
  .status.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid currentColor; }
  .status.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid currentColor; }
  .status.wait { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .55rem 1rem; font-size: .95rem; }
  dt { color: var(--muted); }
  dd { font-weight: 700; overflow-wrap: anywhere; }
  button {
    width: 100%; padding: .8rem; border: none; border-radius: 3px;
    background: var(--accent); color: #fff; font-size: .95rem; font-weight: 700;
    letter-spacing: .12em; font-family: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  textarea {
    width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 3px;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, monospace; font-size: .8rem; min-height: 96px;
    margin-bottom: .8rem; box-sizing: border-box; resize: vertical;
  }
  .card-label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .4rem; }
  .hint { color: var(--muted); font-size: .8rem; text-align: center; margin-top: .6rem; line-height: 1.5; }
  footer { margin-top: auto; padding-top: 1.5rem; font-size: .8rem; color: var(--muted); }
  footer a { color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">真</div>
    <h1>Makozumi</h1>
    <div class="tagline">Truly Genuine</div>
  </header>

  <div id="status" class="status wait">
    <div class="big">TAP A TAG</div>
    <div class="sub">Tap a Makozumi NFC tag with your phone, or scan below.</div>
  </div>

  <div id="info" class="card hidden">
    <dl>
      <dt>Product</dt><dd id="f-product"></dd>
      <dt>Type</dt><dd id="f-type"></dd>
      <dt>Made by</dt><dd id="f-owner"></dd>
      <dt>Date</dt><dd id="f-date"></dd>
      <dt>Serial</dt><dd id="f-serial"></dd>
    </dl>
  </div>

  <div class="card" id="paste-card">
    <label class="card-label" for="code-input">Or paste a Makozumi code (the full tag URL or just the code)</label>
    <textarea id="code-input" placeholder="eyJ2IjoxLCJzbiI6…  or  https://…/makozumi/#eyJ2…"></textarea>
    <button id="verify-btn">Verify code</button>
  </div>

  <div class="card" id="scan-card">
    <button id="scan-btn">Scan a tag with this phone</button>
    <div class="hint" id="scan-hint">
      Direct in-browser scanning needs Web&nbsp;NFC (Android + Chrome).
      On iPhone, just tap the tag — it opens this page automatically.
    </div>
  </div>

  <footer><a href="how-it-works.html">How the cryptography works</a></footer>
</div>

<script>
// WebCrypto only exists on secure (https) pages. If we were served over
// plain http (e.g. a custom domain without HTTPS enforced yet), bounce to
// the always-https GitHub Pages URL, keeping the #payload.signature intact.
if (location.protocol === "http:" && location.hostname !== "localhost") {
  location.replace("https://katsuma0.github.io/makozumi/" + location.hash);
}

// ============================================================
// Makozumi verifier — ECDSA P-256 (NIST curve secp256r1)
//
// The tag URL fragment carries:  base64url(payload JSON) "." base64url(signature)
// The signature was produced with the Makozumi PRIVATE key (held offline).
// This page holds only the PUBLIC key below, which can VERIFY signatures
// but — by the hardness of the elliptic-curve discrete logarithm problem —
// cannot be used to CREATE them. So anyone can check a tag; only the
// private-key holder can mint one.
// ============================================================

const PUBLIC_KEY_JWK = {
  kty: "EC",
  crv: "P-256",
  x: "sx2H14imF2Nnbvqu851Plz6Ix6Ln0j1EOr29uIYgYCk",
  y: "UpJseEdlrvRy4jrGvJ5Kq_FkVJLgRQZU7tHfj6rgeSM"
};

const $ = (id) => document.getElementById(id);

function b64urlToBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}

async function importPublicKey() {
  return crypto.subtle.importKey(
    "jwk", PUBLIC_KEY_JWK,
    { name: "ECDSA", namedCurve: "P-256" },
    false, ["verify"]
  );
}

function setStatus(cls, big, sub) {
  const el = $("status");
  el.className = "status " + cls;
  el.innerHTML = '<div class="big"></div><div class="sub"></div>';
  el.querySelector(".big").textContent = big;
  el.querySelector(".sub").textContent = sub;
}

function showInfo(p) {
  $("f-product").textContent = p.p || "—";
  $("f-type").textContent = p.t || "—";
  $("f-owner").textContent = p.o || "—";
  $("f-date").textContent = p.d || "—";
  $("f-serial").textContent = p.sn || "—";
  $("info").classList.remove("hidden");
}

async function verifyToken(token) {
  $("info").classList.add("hidden");
  try {
    const parts = token.split(".");
    if (parts.length !== 2) throw new Error("malformed token");
    const [payloadB64, sigB64] = parts;

    // Verify the ECDSA signature over the payload bytes.
    const key = await importPublicKey();
    const valid = await crypto.subtle.verify(
      { name: "ECDSA", hash: "SHA-256" },
      key,
      b64urlToBytes(sigB64),
      new TextEncoder().encode(payloadB64)
    );

    if (!valid) {
      setStatus("bad", "✕ NOT AUTHENTIC", "The signature does not match. This tag was not issued by Makozumi, or its data was altered.");
      return;
    }

    const payload = JSON.parse(new TextDecoder().decode(b64urlToBytes(payloadB64)));
    setStatus("ok", "✓ AUTHENTIC", "Signature verified against the Makozumi public key.");
    showInfo(payload);
  } catch (e) {
    setStatus("bad", "✕ NOT AUTHENTIC", "This tag could not be read as a valid Makozumi token.");
  }
}

function tokenFromUrl(urlish) {
  // Accept a full URL (from NFC scan) or use this page's own fragment.
  try {
    const u = new URL(urlish);
    return u.hash ? u.hash.slice(1) : null;
  } catch { return null; }
}

function checkFragment() {
  const token = location.hash.slice(1);
  if (token) verifyToken(token);
}

// --- Web NFC (Android Chrome) -------------------------------
async function scan() {
  if (!("NDEFReader" in window)) {
    $("scan-hint").textContent = "Web NFC isn’t available in this browser. Tap the tag with your phone instead — it opens this page automatically.";
    return;
  }
  const btn = $("scan-btn");
  try {
    const reader = new NDEFReader();
    await reader.scan();
    btn.disabled = true;
    btn.textContent = "Hold the tag to your phone…";
    reader.onreading = (event) => {
      for (const record of event.message.records) {
        let text = null;
        if (record.recordType === "url" || record.recordType === "text") {
          text = new TextDecoder().decode(record.data);
        }
        if (!text) continue;
        const token = tokenFromUrl(text) || (text.includes(".") ? text : null);
        if (token) {
          verifyToken(token);
          btn.disabled = false;
          btn.textContent = "Scan a tag with this phone";
          return;
        }
      }
      setStatus("bad", "✕ NOT AUTHENTIC", "The scanned tag doesn’t contain a Makozumi token.");
      btn.disabled = false;
      btn.textContent = "Scan a tag with this phone";
    };
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Scan a tag with this phone";
    $("scan-hint").textContent = "NFC scan failed or was blocked: " + e.message;
  }
}

$("verify-btn").addEventListener("click", () => {
  const text = $("code-input").value.trim();
  if (!text) return;
  const token = tokenFromUrl(text) || (text.includes(".") ? text : null);
  if (token) {
    verifyToken(token);
  } else {
    setStatus("bad", "✕ NOT AUTHENTIC", "That doesn’t look like a Makozumi code — expected two dot-separated parts or a tag URL.");
  }
});

$("scan-btn").addEventListener("click", scan);
window.addEventListener("hashchange", checkFragment);
checkFragment();
</script>
</body>
</html>
