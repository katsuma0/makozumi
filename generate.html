<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makozumi — Tag Generator (private)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f2e9; --card: #fdfbf5; --ink: #26221e; --muted: #877f73;
    --line: #e2dac9; --accent: #c73e2e; --warn-bg: #f6ecd8; --warn: #8a6118;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f; --card: #1e1a15; --ink: #eae3d6; --muted: #9c9384;
      --line: #37312a; --accent: #e0563f; --warn-bg: #2e2617; --warn: #d9b36a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; padding: 2.5rem 1rem;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.25rem; font-weight: 500; letter-spacing: .4em; text-transform: uppercase; text-align: center; padding-left: .4em; }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; letter-spacing: .1em; margin: .5rem 0 1.4rem; }
  .warn {
    background: var(--warn-bg); color: var(--warn); border: 1px solid currentColor; border-radius: 5px;
    padding: .8rem 1rem; font-size: .85rem; margin-bottom: 1rem; line-height: 1.5;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 1.5rem; margin-bottom: 1rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin: .9rem 0 .25rem; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 3px;
    background: var(--bg); color: var(--ink); font-size: .95rem; font-family: inherit;
  }
  textarea { font-family: ui-monospace, monospace; font-size: .8rem; min-height: 88px; }
  button {
    width: 100%; padding: .8rem; margin-top: 1.2rem; border: none; border-radius: 3px;
    background: var(--accent); color: #fff; font-size: .95rem; font-weight: 700;
    letter-spacing: .12em; font-family: inherit; cursor: pointer;
  }
  .out { margin-top: 1rem; }
  .out textarea { min-height: 120px; }
  .err { color: #c0392b; font-size: .85rem; margin-top: .8rem; }
  .ok-note { color: var(--muted); font-size: .8rem; margin-top: .5rem; }
  a { color: var(--accent); }
  footer { text-align: center; font-size: .8rem; margin-top: .5rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Makozumi Generator</h1>
  <div class="sub">Mint a signed tag for a new product</div>

  <div class="warn">
    ⚠ Private tool. Signing happens entirely in your browser — nothing is uploaded.
    Only someone holding the Makozumi <strong>private key</strong> can produce a valid tag;
    without it this page generates nothing useful.
  </div>

  <div class="card">
    <label for="privkey">Private key (JWK JSON — paste from your safe storage)</label>
    <textarea id="privkey" placeholder='{"kty":"EC","crv":"P-256","x":"...","y":"...","d":"..."}'></textarea>

    <label for="p">Product name</label>
    <input id="p" placeholder="Katsuma 2026 Log">

    <label for="t">Product type</label>
    <input id="t" placeholder="Notebook">

    <label for="o">Made by</label>
    <input id="o" value="Katsuma Onishi">

    <label for="d">Date</label>
    <input id="d" type="date">

    <label for="sn">Serial number</label>
    <input id="sn" placeholder="MKZ-0002">

    <button id="go">Sign &amp; generate tag URL</button>
    <div class="err" id="err"></div>

    <div class="out">
      <label for="url">Tag URL — write this to the NFC tag as a URL record</label>
      <textarea id="url" readonly placeholder="(appears here after signing)"></textarea>
      <div class="ok-note" id="note"></div>
    </div>
  </div>

  <footer><a href="index.html">← back to verifier</a></footer>
</div>

<script>
// WebCrypto only exists on secure (https) pages — bounce plain-http loads
// to the always-https GitHub Pages URL.
if (location.protocol === "http:" && location.hostname !== "localhost") {
  location.replace("https://katsuma0.github.io/makozumi/generate.html");
}

// ============================================================
// Makozumi tag generator — signs a product payload with the
// Makozumi ECDSA P-256 PRIVATE key. Runs 100% locally.
// The verify page (index.html) checks the result with the
// matching PUBLIC key.
// ============================================================

const SITE = "https://katsuma0.github.io/makozumi/";
const $ = (id) => document.getElementById(id);

const bytesToB64url = (bytes) =>
  btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

$("d").value = new Date().toISOString().slice(0, 10);

$("go").addEventListener("click", async () => {
  $("err").textContent = "";
  $("note").textContent = "";
  $("url").value = "";
  try {
    const jwk = JSON.parse($("privkey").value.trim());
    if (!jwk.d) throw new Error("That JWK has no private part ('d') — it looks like the public key.");

    const key = await crypto.subtle.importKey(
      "jwk", jwk, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]
    );

    const payload = {
      v: 1,
      sn: $("sn").value.trim(),
      p: $("p").value.trim(),
      t: $("t").value.trim(),
      o: $("o").value.trim(),
      d: $("d").value,
    };
    if (!payload.p || !payload.sn) throw new Error("Product name and serial number are required.");

    const payloadB64 = bytesToB64url(new TextEncoder().encode(JSON.stringify(payload)));
    const sig = await crypto.subtle.sign(
      { name: "ECDSA", hash: "SHA-256" },
      key,
      new TextEncoder().encode(payloadB64)
    );

    const url = SITE + "#" + payloadB64 + "." + bytesToB64url(sig);
    $("url").value = url;
    $("note").textContent = url.length + " characters — fits NTAG215/216 tags. Test it by opening the URL, then write it to the tag with an app like “NFC Tools” (Write → URL record).";
  } catch (e) {
    $("err").textContent = e.message;
  }
});
</script>
</body>
</html>
